services:
  asr-test:
    profiles: [asr]
    build: ./asr
    env_file: .asr.env
    volumes:
      - materials:/data:ro
      - ./.asr-cache:/cache
      - ./asr-results:/output
    networks: [outbound]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    tmpfs: [/tmp:size=256m]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '2'}
